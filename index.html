<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Embedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kablammo&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sour+Gummy:ital,wdth,wght@0,100..125,100..900;1,100..125,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>This is a fancy title</h1>
        </header>

        <main>
            <section>
                <!-- ai prompt for placeholder content:
                 in the main, add a section with an h3 and two paragraphs about snow -->
                <h3>Snow</h3>
                <p>Snow is frozen precipitation that falls from clouds when temperatures are cold enough.</p>
                <p>Soft, fluffy snowflakes can turn familiar landscapes into quiet winter scenes.</p>
            </section>

            <section>
                <!-- embedding external resources like
                 videos and maps -->
                 <iframe width="560" height="315" src="https://www.youtube.com/embed/qk6MeIXsUeU?si=i9Qe5O2e12RsLMC7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </section>

            <section>
                <iframe class="maps" src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3019.4007634580357!2d-75.76052097367317!3d45.34901109111687!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1salgonquin%20college!5e1!3m2!1sen!2sca!4v1795541881599!5m2!1sen!2sca" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
        </main>
    </div>
    
</body>
</html>
